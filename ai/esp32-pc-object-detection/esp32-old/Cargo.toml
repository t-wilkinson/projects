[package]
name = "esp32"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
esp-idf-sys = { version = "0.33", features = ["binstart"] }
esp-idf-svc = { version = "0.47", features = ["std"] }
embedded-svc = "0.26"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# You will need specialized bindings for the OV2640 driver
esp32-camera-rs = "0.1"
